<section class="videos-page">
  <div class="videos-inner">
    <div class="videos-header">
      <h1 class="videos-title">Mis vídeos</h1>
      <p class="videos-subtitle">
        Videoclips oficiales y canciones que forman parte de mi proyecto.
      </p>
    </div>
  </div>

  <div class="videos-grid">
    @for (video of videos; track video.id) {
      <article class="video-item">
        <div class="video-wrapper">
          @if (video.referrerPolicy) {
            <iframe
              [attr.width]="video.width ?? null"
              [attr.height]="video.height ?? null"
              [src]="video.embedUrl"
              [title]="video.accessibleTitle"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>
          } @else {
            <iframe
              [attr.width]="video.width ?? null"
              [attr.height]="video.height ?? null"
              [src]="video.embedUrl"
              [title]="video.accessibleTitle"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen
            >
            </iframe>
          }
        </div>
        <h3 class="video-title">{{ video.title }}</h3>
      </article>
    }
  </div>
</section>
